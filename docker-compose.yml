# Bug #9, #10, #46: Distributable docker-compose for Babel
# Uses environment variables for media paths so anyone can run it.
#
# Usage:
#   TV_PATH=/path/to/tv MOVIES_PATH=/path/to/movies docker compose up -d
#
# Or create a .env file with:
#   TV_PATH=/data/media/tv
#   MOVIES_PATH=/data/media/movies

services:
  babel:
    build: .
    image: babel:latest
    container_name: babel
    environment:
      - TZ=${TZ:-Europe/Stockholm}
      - PORT=8765
      - BABEL_DB_PATH=/app/data/babel.db
    volumes:
      - ./data:/app/data
      - ${TV_PATH:-/data/media/tv}:/tv
      - ${MOVIES_PATH:-/data/media/movies}:/movies
      - /var/run/docker.sock:/var/run/docker.sock  # Optional: for Bazarr container control
    ports:
      - "${BABEL_PORT:-8765}:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8765/api/stats || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
