name: Publish Docker image

on:
  push:
    tags:
      - "v*"

# Serialize channel updates; preflight also rejects tags on an outdated main.
concurrency:
  group: babel-public-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hugomossberg/babel

jobs:
  test:
    if: github.repository == 'hugomossberg/Babel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Validate release source, version and notes
        run: python .github/scripts/release_preflight.py
      - name: Set up Node for UI regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio
      - name: Run syntax checks
        run: |
          python -m compileall app tests
      - name: Run tests
        run: |
          pytest -v

  publish:
    if: github.repository == 'hugomossberg/Babel'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BABEL_VERSION=${{ steps.version.outputs.version }}

  release:
    if: github.repository == 'hugomossberg/Babel'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          name: Babel ${{ github.ref_name }}
